<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI会社 ダッシュボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <h1>AI会社 ダッシュボード</h1>
  <p class="muted">ボス専用・見るだけの画面です</p>
  <form id="loginForm">
    <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
    <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">ログイン</button>
    <p id="loginError" class="error" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div>
      <div class="title">AI会社</div>
      <div class="muted small" id="updated">読み込み中…</div>
    </div>
    <div class="top-actions">
      <button id="refresh" class="ghost" aria-label="更新">更新</button>
      <button id="logout" class="ghost">ログアウト</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <a href="#home" data-tab="home">ホーム</a>
    <a href="#office" data-tab="office">オフィス</a>
    <a href="#biz" data-tab="biz">事業</a>
    <a href="#cost" data-tab="cost">費用</a>
    <a href="#history" data-tab="history">履歴</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
